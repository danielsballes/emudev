name: Bug
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to...
        2. Click...
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Module / lesson
      placeholder: chip8 / 07-display
  - type: input
    id: era
    attributes:
      label: Visual era (if it is a UI bug)
      placeholder: chip8
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 140 / Windows 11
