name: Lesson or module
description: Propose or fix educational content
labels: [content]
body:
  - type: input
    id: module
    attributes:
      label: Module
      placeholder: chip8
    validations:
      required: true
  - type: input
    id: lesson
    attributes:
      label: Lesson (if applicable)
      placeholder: 05-decode
  - type: textarea
    id: details
    attributes:
      label: What should be added or fixed
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Technical documentation, specs, test ROMs...
